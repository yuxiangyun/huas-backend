# [INPUT]: 依赖 Bun HTTP 服务与域名证书，代理等待覆盖应用学校访问及课表仲裁预算。
# [OUTPUT]: 提供独立部署的 Nginx 参考配置，不由维护发布脚本自动安装。
# [POS]: 根目录反向代理模板；现有宝塔站点的有效配置由部署手册单独约束。
# [PROTOCOL]: 变更时更新此头部，然后检查 AGENTS.md

upstream huas_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL certificates (use certbot / acme.sh)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # Request size limit
    client_max_body_size 100m;

    location / {
        proxy_pass http://huas_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 学校访问最长 45 秒、课表仲裁 50 秒；读等待预留 10 秒响应余量。
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # Health check (no log)
    location = /health {
        proxy_pass http://huas_backend;
        access_log off;
    }
}
